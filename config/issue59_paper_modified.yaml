# Issue #59 paper-modified Justin-right HGC arm.
# The shared trainer selects the independent paper-modified voxel arm from arm.
arm: paper_modified
output_contract: q_contact_only
pose_supervision:
  direct_axis_min_cosine: 0.9999
data:
  root: /home/irsl/datasets/dlr/compiled/scdm_paper_floor_10000_v7
  grid_size: 64
  grid_edge_m: 0.5
  num_grasps: 100
  # GT object voxels sampled outside all positive approach anchors provide
  # class-0 supervision to the paper-modified dense quality head.
  negative_voxel_count: 100
  split_seed: 0
  gripper_config: /home/irsl/datasets/dlr/grippers/justin_hand/justin_right_hand_simple.yaml
  representation: gt_full_occupancy_ground
model:
  encoder: 3d_fpn
  in_channels: 2
  channels: [32, 64, 128, 256]
  scales: [2, 2, 2, 4]
  out_channels: 128
  align_corners: true
  head: paper_modified_dense_quality_orientation_contact
# Runtime returns palm pose, quality, and learned q_contact.  The grasp-sim
# JustinContactWaypointMapper derives execution q_open/q_squeeze waypoints.
training:
  epochs: 80
  batch_size: 16
  workers: 8
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.000001
  seed: 0
  checkpoint_every_epochs: 1
  validate_every_epochs: 1
  progress_every_batches: 100
